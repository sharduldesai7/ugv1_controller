# ros_gz_bridge configuration for the UGV1 simulation.
# Topic names are identical on both sides, so the rest of the stack sees the
# same names it sees on the real rover.
- {ros_topic_name: /clock,             gz_topic_name: /clock,             ros_type_name: rosgraph_msgs/msg/Clock,   gz_type_name: gz.msgs.Clock,     direction: GZ_TO_ROS}
- {ros_topic_name: /imu/data_raw,      gz_topic_name: /imu/data_raw,      ros_type_name: sensor_msgs/msg/Imu,       gz_type_name: gz.msgs.IMU,       direction: GZ_TO_ROS}
- {ros_topic_name: /video_raw_raw,     gz_topic_name: /video_raw_raw,     ros_type_name: sensor_msgs/msg/Image,     gz_type_name: gz.msgs.Image,     direction: GZ_TO_ROS}
- {ros_topic_name: /scan,              gz_topic_name: /scan,              ros_type_name: sensor_msgs/msg/LaserScan, gz_type_name: gz.msgs.LaserScan, direction: GZ_TO_ROS}
- {ros_topic_name: /wheel_odom,        gz_topic_name: /wheel_odom,        ros_type_name: nav_msgs/msg/Odometry,     gz_type_name: gz.msgs.Odometry,  direction: GZ_TO_ROS}
- {ros_topic_name: /ground_truth/odom, gz_topic_name: /ground_truth/odom, ros_type_name: nav_msgs/msg/Odometry,     gz_type_name: gz.msgs.Odometry,  direction: GZ_TO_ROS}
- {ros_topic_name: /cmd_vel,           gz_topic_name: /cmd_vel,           ros_type_name: geometry_msgs/msg/Twist,   gz_type_name: gz.msgs.Twist,     direction: ROS_TO_GZ}
