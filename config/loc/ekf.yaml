# robot_localization: wheel odometry (speed, turn rate) plus gyro turn rate -> odom -> base_link.
# Order of each 15-value list: x y z roll pitch yaw  vx vy vz  vroll vpitch vyaw  ax ay az
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /wheel_odom/conditioned
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 20
    imu0: /imu/conditioned
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 50
    imu0_remove_gravitational_acceleration: false
